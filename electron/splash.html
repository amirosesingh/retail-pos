<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
  <title>Retail</title>
  <style>
    :root { color-scheme: light dark; --background:#f8fafc; --text:#172033; --muted:#637087; --line:#dce5f0; --accent:#1673d1; }
    @media (prefers-color-scheme: dark) { :root { --background:#111827; --text:#f1f5f9; --muted:#a4b1c5; --line:#29364a; --accent:#68b6ff; } }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--background); color:var(--text); font:14px/1.5 "Segoe UI",system-ui,sans-serif; -webkit-app-region:drag; }
    main { width:min(100%,280px); text-align:center; }
    .identity { display:flex; align-items:center; justify-content:center; gap:12px; }
    img { display:block; width:44px; height:44px; flex:none; object-fit:contain; }
    h1 { margin:0; font-size:28px; font-weight:650; letter-spacing:-.7px; line-height:1.2; }
    .caption { margin:12px 0 22px; color:var(--muted); font-size:12px; }
    .track { height:3px; width:160px; margin:0 auto; border-radius:4px; overflow:hidden; background:var(--line); }
    .track::after { content:""; display:block; height:100%; width:45%; border-radius:inherit; background:var(--accent); animation:loading 1.5s ease-in-out infinite; }
    .status { margin:12px 0 0; color:var(--muted); font-size:12px; }
    @keyframes loading { from { transform:translateX(-110%); } to { transform:translateX(330%); } }
    @media (prefers-reduced-motion: reduce) { .track::after { animation:none; width:100%; opacity:.6; } }
  </style>
</head>
<body>
  <main aria-label="Retail startup">
    <div class="identity"><img src="app-icon.ico" alt=""><h1>Retail</h1></div>
    <p class="caption">Point of sale &amp; shop management</p>
    <div class="track" aria-hidden="true"></div>
    <p class="status" role="status" aria-live="polite">Opening your workspace…</p>
  </main>
</body>
</html>
