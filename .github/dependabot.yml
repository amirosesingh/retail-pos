version: 2
updates:
  # Security patches only — no routine version-bump noise.
  - package-ecosystem: npm
    directory: "/"
    target-branch: beta
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["security", "beta"]
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: beta
    schedule:
      interval: monthly
    labels: ["security", "beta"]
