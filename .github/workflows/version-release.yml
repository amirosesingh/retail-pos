name: Prepare release version

on:
  push:
    branches: [main]

concurrency:
  group: prepare-release-version
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '[release]') && !contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Increase shared application version
        id: version
        run: |
          git pull --ff-only origin main
          git fetch --tags --force origin
          version=$(node -p "require('./package.json').version")
          # Keep a version prepared in the PR. Only advance an already-tagged
          # version, so the reviewed number is the one both platforms ship.
          while git rev-parse -q --verify "refs/tags/v$version" >/dev/null; do
            version=$(node scripts/bump-version.cjs)
          done
          node scripts/bump-version.cjs --write
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag release version
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Release tag already exists: $tag"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/version.ts database/sqlserver/retail-pos-local-database.sql database/sqlserver/retail-pos-local-update.sql
          if ! git diff --cached --quiet; then
            git commit -m "chore: release $tag [release]"
          fi
          git tag "$tag"
          # Publish the release commit and its immutable tag in one receive.
          # A split push can advance main and then leave the release untagged
          # if the server has not made the new commit reachable to a second
          # receive yet (GitHub reports this as "missing necessary objects").
          git push --atomic origin HEAD:main "refs/tags/$tag:refs/tags/$tag"

      # Pushes made with GITHUB_TOKEN do not start other push workflows.
      # Dispatch both builds against the immutable release tag so Windows,
      # Android, GitHub Releases and the R2 manifests all identify the exact
      # same source commit and version.
      - name: Start platform release builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          gh workflow run desktop-release.yml --ref "$tag"
          gh workflow run android-apk.yml --ref "$tag"
