name: Prepare release version

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Security checks]
    types: [completed]
    branches: [main]

concurrency:
  group: prepare-release-version
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  checks: read
  pull-requests: read

jobs:
  bump:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Require merged PRs and passing checks
        id: ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha=$(git rev-parse HEAD)
          if [ -n "$CHECKED_SHA" ] && [ "$CHECKED_SHA" != "$sha" ]; then
            echo "Main has advanced; wait for checks on the current commit."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          tagged=$(git rev-parse -q --verify "refs/tags/v$version^{commit}" || true)
          if [ "$tagged" = "$sha" ]; then
            echo "This commit already has release v$version; no new version needed."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open=$(gh pr list --state open --base main --json number --jq 'length')
          if [ "$open" -ne 0 ]; then
            echo "Waiting for all open PRs targeting main to be merged."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" --jq '[.check_runs[] | select(.name == "Role & permission regression checks" and .status == "completed" and .conclusion == "success")] | length')
          if [ "$passed" -eq 0 ]; then
            echo "The final main commit must pass Security checks before version creation."
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Increase shared application version
        if: steps.ready.outputs.release == 'true'
        id: version
        run: |
          git fetch --tags --force origin
          version=$(node -p "require('./package.json').version")
          # Keep a version prepared in the PR. Only advance an already-tagged
          # version, so the reviewed number is the one both platforms ship.
          while git rev-parse -q --verify "refs/tags/v$version" >/dev/null; do
            version=$(node scripts/bump-version.cjs)
          done
          node scripts/bump-version.cjs --write
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag release version
        if: steps.ready.outputs.release == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Release tag already exists: $tag"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/version.ts database/sqlserver/retail-pos-local-database.sql database/sqlserver/retail-pos-local-update.sql
          # Cloudflare deploys only this final version commit. Keep that marker
          # even when the PR already prepared every versioned file.
          git commit --allow-empty -m "chore: release $tag [release]"
          git tag "$tag"
          # Publish the release commit and its immutable tag in one receive.
          # A split push can advance main and then leave the release untagged
          # if the server has not made the new commit reachable to a second
          # receive yet (GitHub reports this as "missing necessary objects").
          git push --atomic origin HEAD:main "refs/tags/$tag:refs/tags/$tag"

      # Pushes made with GITHUB_TOKEN do not start other push workflows.
      # Dispatch both builds against the immutable release tag so Windows,
      # Android, GitHub Releases and the R2 manifests all identify the exact
      # same source commit and version.
      - name: Start platform release builds
        if: steps.ready.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          gh workflow run platform-release.yml --ref "$tag"
