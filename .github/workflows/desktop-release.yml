name: Desktop release (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: pos-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release identity
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            tag="${{ github.ref_name }}"
            if [ "$tag" != "v$version" ]; then
              echo "Tag $tag does not match package version v$version"; exit 1
            fi
          else
            tag="v$version"
          fi
          {
            echo "version=$version"
            echo "build_number=$(git rev-list --count HEAD)"
            echo "tag=$tag"
            echo "commit=$GITHUB_SHA"
            echo "release_id=$tag-$short"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release branch and version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          node scripts/publish-windows-release.cjs --preflight

      - name: Test application and updater
        run: |
          npm test
          node --test scripts/test-update-install.cjs scripts/test-updater.cjs scripts/test-windows-publish.cjs scripts/test-update-history.cjs scripts/test-shutdown-sync.cjs

      - name: Build Electron installer
        env:
          POS_UPDATE_URL: ${{ vars.POS_UPDATE_URL }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          FORCE_CODE_SIGNING: ${{ secrets.WIN_CSC_LINK != '' }}
        run: npm run desktop:release

      - name: Test packaged startup and secure IPC
        run: node scripts/electron-runtime-smoke.cjs release/win-unpacked

      - name: Verify Windows publisher signature
        env:
          WINDOWS_SIGNING_CONFIGURED: ${{ secrets.WIN_CSC_LINK != '' }}
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_CONFIGURED -ne 'true') { Write-Output 'Unsigned release explicitly permitted; SHA512 verification remains required.'; exit 0 }
          $installers = @(Get-ChildItem -LiteralPath release -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          if ($signature.Status -ne 'Valid') { throw 'The release installer must have a valid Authenticode signature.' }

      - name: Write release manifest
        shell: bash
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('release/release.json',JSON.stringify({version:'${{ steps.meta.outputs.version }}',tag:'${{ steps.meta.outputs.tag }}',commit:'${{ steps.meta.outputs.commit }}',released:new Date().toISOString(),path:'pos-app/releases/${{ steps.meta.outputs.release_id }}/'},null,2))"

      - name: Stage and validate publishable files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upload && mkdir -p upload
          shopt -s nullglob
          for f in release/*.exe release/*.exe.blockmap release/latest.yml release/release.json; do
            cp "$f" upload/
          done
          v="${{ steps.meta.outputs.version }}"
          expected="Retail Setup $v.exe"
          base="https://updatecms.luckycharmsdnbhd.com/pos-app"
          epoch=$(node -e "const m=/BUNDLE_EPOCH\s*=\s*(\d+)/.exec(require('fs').readFileSync('src/lib/bundle-epoch.ts','utf8'));if(!m){process.exit(1)}console.log(m[1])")
          if [ ! -f "upload/$expected" ]; then
            echo "Expected Windows installer is missing: upload/$expected"
            ls -la release upload
            exit 1
          fi
          if [ ! -s upload/latest.yml ]; then
            echo "release/latest.yml was not generated or is empty"
            exit 1
          fi
          if ! grep -Fq "$expected" upload/latest.yml; then
            echo "latest.yml does not reference the exact installer: $expected"
            cat upload/latest.yml
            exit 1
          fi
          node -e "const fs=require('fs');fs.writeFileSync('upload/manifest.json',JSON.stringify({version:'$v',buildNumber:Number('${{ steps.meta.outputs.build_number }}'),releaseNotes:'Release $v',apkUrl:'$base/latest/android/Retail-$v.apk',bundleEpoch:Number('$epoch'),windowsUrl:'$base/latest/Retail%20Setup%20$v.exe'}))"
          ls -la upload

      - name: Deploy to Cloudflare R2
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          # Verify uploaded bytes at R2 origin; public probes before uploading
          # can cache a 404 for a new numbered installer URL.
          R2_VERIFY_ORIGIN: "true"
        run: node scripts/publish-windows-release.cjs

      - name: Attach installer to the GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
            upload/release.json
            upload/releases.json
