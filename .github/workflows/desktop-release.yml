name: Desktop release (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release identity
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            tag="${{ github.ref_name }}"
            if [ "$tag" != "v$version" ]; then
              echo "Tag $tag does not match package version v$version"; exit 1
            fi
          else
            tag="v$version"
          fi
          {
            echo "version=$version"
            echo "build_number=$(git rev-list --count HEAD)"
            echo "tag=$tag"
            echo "commit=$GITHUB_SHA"
            echo "release_id=$tag-$short"
          } >> "$GITHUB_OUTPUT"

      - name: Build Electron installer
        env:
          POS_UPDATE_URL: ${{ vars.POS_UPDATE_URL }}
        run: npm run desktop:release

      - name: Write release manifest
        shell: bash
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('release/release.json',JSON.stringify({version:'${{ steps.meta.outputs.version }}',tag:'${{ steps.meta.outputs.tag }}',commit:'${{ steps.meta.outputs.commit }}',released:new Date().toISOString(),path:'pos-app/releases/${{ steps.meta.outputs.release_id }}/'},null,2))"

      - name: Stage and validate publishable files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upload && mkdir -p upload
          shopt -s nullglob
          for f in release/*.exe release/*.exe.blockmap release/latest.yml release/release.json; do
            cp "$f" upload/
          done
          v="${{ steps.meta.outputs.version }}"
          expected="Retail Setup $v.exe"
          base="https://updatecms.luckycharmsdnbhd.com/pos-app"
          epoch=$(node -e "const m=/BUNDLE_EPOCH\s*=\s*(\d+)/.exec(require('fs').readFileSync('src/lib/bundle-epoch.ts','utf8'));if(!m){process.exit(1)}console.log(m[1])")
          if [ ! -f "upload/$expected" ]; then
            echo "Expected Windows installer is missing: upload/$expected"
            ls -la release upload
            exit 1
          fi
          if [ ! -s upload/latest.yml ]; then
            echo "release/latest.yml was not generated or is empty"
            exit 1
          fi
          if ! grep -Fq "$expected" upload/latest.yml; then
            echo "latest.yml does not reference the exact installer: $expected"
            cat upload/latest.yml
            exit 1
          fi
          node -e "const fs=require('fs');fs.writeFileSync('upload/manifest.json',JSON.stringify({version:'$v',buildNumber:Number('${{ steps.meta.outputs.build_number }}'),releaseNotes:'Release $v',apkUrl:'$base/latest/android/Retail-$v.apk',bundleEpoch:Number('$epoch'),windowsUrl:'$base/latest/Retail%20Setup%20$v.exe'}))"
          ls -la upload

      - name: Deploy to Cloudflare R2
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "R2 credentials are required for a Windows release. Refusing to publish a release with no updater files."
            exit 1
          fi
          rid="${{ steps.meta.outputs.release_id }}"
          aws s3 sync upload "s3://updatelccms/pos-app/releases/$rid" --endpoint-url "$R2_ENDPOINT" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync upload s3://updatelccms/pos-app/latest --endpoint-url "$R2_ENDPOINT" --cache-control "no-cache" --delete --exclude "android/*"
          aws s3 cp upload/manifest.json s3://updatelccms/pos-app/manifest.json --endpoint-url "$R2_ENDPOINT" --cache-control "no-cache" --content-type "application/json"


      - name: Remove build scratch left in the bucket by earlier releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_ENDPOINT" ]; then exit 0; fi
          for stray in win-unpacked builder-debug.yml builder-effective-config.yaml .icon-ico .cache; do
            aws s3 rm "s3://updatelccms/pos-app/$stray" --recursive --endpoint-url "$R2_ENDPOINT" || true
            aws s3 rm "s3://updatelccms/pos-app/latest/$stray" --recursive --endpoint-url "$R2_ENDPOINT" || true
          done

      - name: Keep only the five most recent releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_ENDPOINT" ]; then exit 0; fi
          RETAIN=5
          folders=$(aws s3 ls s3://updatelccms/pos-app/releases/ --endpoint-url "$R2_ENDPOINT" | awk '/PRE/ {print $2}' | sort)
          total=$(echo "$folders" | grep -c . || true)
          if [ "$total" -le "$RETAIN" ]; then echo "Nothing to prune ($total kept)."; exit 0; fi
          echo "$folders" | head -n "$((total - RETAIN))" | while read -r old; do
            [ -z "$old" ] && continue
            echo "Removing old release $old"
            aws s3 rm "s3://updatelccms/pos-app/releases/$old" --recursive --endpoint-url "$R2_ENDPOINT" || true
          done

      - name: Attach installer to the GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
            release/release.json
