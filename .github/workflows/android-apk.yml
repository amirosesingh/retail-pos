name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Optional: load a hosted site instead of the offline app baked into the APK"
        required: false
        default: ""
  workflow_call:
    inputs:
      release_channel:
        type: string
        default: stable
      beta_version:
        type: string
        default: ""
      beta_number:
        type: number
        default: 0
      build_only:
        type: boolean
        default: true
      app_url:
        type: string
        default: ""

concurrency:
  group: pos-release-${{ inputs.build_only && format('android-{0}', github.ref) || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    if: "inputs.release_channel == 'beta' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    env:
      POS_RELEASE_CHANNEL: ${{ inputs.release_channel || 'stable' }}
      ANDROID_GOOGLE_SERVICES_JSON: ${{ inputs.release_channel == 'beta' && secrets.ANDROID_BETA_GOOGLE_SERVICES_JSON || inputs.release_channel != 'beta' && secrets.ANDROID_GOOGLE_SERVICES_JSON || '' }}
      VITE_ANDROID_PUSH_ENABLED: ${{ (inputs.release_channel == 'beta' && secrets.ANDROID_BETA_GOOGLE_SERVICES_JSON != '' || inputs.release_channel != 'beta' && secrets.ANDROID_GOOGLE_SERVICES_JSON != '') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # The old SDK `tools` package was removed from Google's repository.
          # Command-line tools are installed by the action itself; requesting
          # only platform-tools avoids `sdkmanager: Failed to find package tools`.
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Resolve release identity
        id: meta
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel || 'stable' }}
          BETA_VERSION: ${{ inputs.beta_version }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$RELEASE_CHANNEL" = "beta" ]; then version="$BETA_VERSION"; fi
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          if [ "$RELEASE_CHANNEL" = "beta" ]; then
            node -e "if(!/^\d+\.\d+\.\d+-beta\.[1-9]\d*$/.test(process.env.BETA_VERSION||''))process.exit(1)"
          fi
          if [ "$RELEASE_CHANNEL" != "beta" ] && [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            tag="${{ github.ref_name }}"
            if [ "$tag" != "v$version" ]; then
              echo "Tag $tag does not match package version v$version"; exit 1
            fi
          else
            tag="v$version"
          fi
          if [ "$RELEASE_CHANNEL" = "beta" ]; then tag="beta-v$version"; fi
          {
            echo "version=$version"
            if [ "$RELEASE_CHANNEL" = "beta" ]; then echo "build_number=${{ inputs.beta_number }}"; else echo "build_number=$(git rev-list --count HEAD)"; fi
            echo "tag=$tag"
            echo "commit=$GITHUB_SHA"
            echo "release_id=$tag-$short"
          } >> "$GITHUB_OUTPUT"

      # No web environment is provided to this job on purpose: the APK is
      # handed to other shops and must carry no project address, key or
      # backend URL. The phone is told where to connect during activation or
      # in Settings -> Database & Cloud Connection.
      - name: Prepare beta package identity
        if: inputs.release_channel == 'beta'
        env:
          BETA_VERSION: ${{ inputs.beta_version }}
        run: node scripts/prepare-beta.cjs

      - name: Build the offline app bundle
        if: ${{ !inputs.app_url }}
        run: npm run mobile:build

      - name: Add Android platform
        env:
          POS_MOBILE_URL: ${{ inputs.app_url }}
        run: |
          npx cap add android || true
          npx cap sync android
          node scripts/android-permissions.cjs
          node scripts/android-push-setup.cjs
          node scripts/android-update-setup.cjs

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required GitHub secret: $name"; exit 1; fi
          done

      - name: Configure signed upgrade build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
          ANDROID_VERSION_NAME: ${{ steps.meta.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.meta.outputs.build_number }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode --ignore-garbage > "$ANDROID_KEYSTORE_FILE"
          if [ ! -s "$ANDROID_KEYSTORE_FILE" ]; then
            echo "Decoded keystore is empty — check the ANDROID_KEYSTORE_BASE64 secret."; exit 1
          fi
          node scripts/android-release.cjs

      - name: Verify generated camera permission
        run: |
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.mlkit.vision.DEPENDENCIES' android/app/src/main/AndroidManifest.xml
          grep -q 'barcode_ui' android/app/src/main/AndroidManifest.xml

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature and release certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)
          if [ -z "$apk" ] || [ -z "$apksigner" ]; then
            echo "Release APK or apksigner was not found."; exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk" | tee /tmp/apk-signature.txt
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_FILE" -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -file /tmp/release-cert.der
          expected=$(sha256sum /tmp/release-cert.der | awk '{print tolower($1)}')
          actual=$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/apk-signature.txt | head -n1 | tr '[:upper:]' '[:lower:]')
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "APK signer does not match the configured release keystore alias."; exit 1
          fi
          echo "APK signature and signer certificate verified."





      - name: Stage the APK and the web bundle
        run: |
          set -euo pipefail
          v="${{ steps.meta.outputs.version }}"
          rid="${{ steps.meta.outputs.release_id }}"
          prefix="pos-app"
          if [ "$POS_RELEASE_CHANNEL" = "beta" ]; then prefix="$prefix/beta"; fi
          released=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          epoch=$(node -e "const m=/BUNDLE_EPOCH\s*=\s*(\d+)/.exec(require('fs').readFileSync('src/lib/bundle-epoch.ts','utf8'));if(!m){process.exit(1)}console.log(m[1])")
          mkdir -p versioned/android latest/android release-assets
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          aapt=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n1)
          if [ -z "$aapt" ]; then echo "Android build tools are missing aapt"; exit 1; fi
          actual_version=$("$aapt" dump badging "$src" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
          if [ "$actual_version" != "$v" ]; then
            echo "APK versionName '$actual_version' does not match release version '$v'"; exit 1
          fi
          cp "$src" "versioned/android/Retail-$v.apk"
          cp "$src" "latest/android/Retail-$v.apk"
          cp "$src" "latest/android/Retail-latest.apk"
          cp "$src" "release-assets/Retail-$v.apk"
          manifest=$(printf '{"version":"%s","file":"Retail-%s.apk","tag":"%s","commit":"%s","released":"%s","path":"%s/releases/%s/android/"}\n' \
            "$v" "$v" "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.commit }}" "$released" "$prefix" "$rid")
          echo "$manifest" > latest/android/latest.json
          echo "$manifest" > versioned/android/latest.json
          echo "$manifest" > release-assets/latest.json
          # Unified cross-platform manifest read by Android, Windows and web.
          base="https://updatecms.luckycharmsdnbhd.com/pos-app"
          if [ "$POS_RELEASE_CHANNEL" = "beta" ]; then base="$base/beta"; fi
          build="${{ steps.meta.outputs.build_number }}"
          printf '{"version":"%s","buildNumber":%s,"releaseNotes":"%s","apkUrl":"%s/releases/%s/android/Retail-%s.apk","bundleEpoch":%s,"windowsUrl":"%s/latest/Retail%%20Setup%%20%s.exe"}\n' \
            "$v" "$build" "Release $v" "$base" "$rid" "$v" "$epoch" "$base" "$v" > release-assets/manifest.json
          cp release-assets/manifest.json latest/manifest.json 2>/dev/null || { mkdir -p latest && cp release-assets/manifest.json latest/manifest.json; }




      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Retail-android
          if-no-files-found: error
          path: release-assets/*.apk

      - name: Upload verified Android publish artifacts
        if: inputs.build_only && !inputs.app_url
        uses: actions/upload-artifact@v4
        with:
          name: Retail-android-publish
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: release-assets/*

      # A hosted-shell build points the APK at someone else's running site, so
      # it is a test build only and must never reach the release channel.
      - name: Deploy to Cloudflare R2
        if: ${{ !inputs.build_only && !inputs.app_url && startsWith(github.ref, 'refs/tags/v') }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "R2 credentials are required for an Android release."; exit 1
          fi
          rid="${{ steps.meta.outputs.release_id }}"
          aws s3 sync versioned/android "s3://updatelccms/pos-app/releases/$rid/android" \
            --endpoint-url "$R2_ENDPOINT" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync latest/android s3://updatelccms/pos-app/latest/android \
            --endpoint-url "$R2_ENDPOINT" --cache-control "no-cache"
          aws s3 sync latest/android s3://updatelccms/pos-app/android \
            --endpoint-url "$R2_ENDPOINT" --cache-control "no-cache"
          # Keep old numbered APKs for devices holding an earlier feed response.
          aws s3 cp "s3://updatelccms/pos-app/latest/android/Retail-${{ steps.meta.outputs.version }}.apk" /tmp/published-android.apk \
            --endpoint-url "$R2_ENDPOINT" --no-progress
          cmp "release-assets/Retail-${{ steps.meta.outputs.version }}.apk" /tmp/published-android.apk
          # The second successful platform publishes the shared pointer. If
          # either artifact is missing, the previous complete release stays live.
          R2_VERIFY_ORIGIN=true node scripts/publish-update-manifest.cjs release-assets/manifest.json

      # Windows owns shared release retention. Never recursively prune shared
      # release directories here: they contain Windows recovery artifacts too.

      - name: Attach APK to the GitHub release
        if: ${{ !inputs.build_only && !inputs.app_url && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/*.apk
            release-assets/latest.json
