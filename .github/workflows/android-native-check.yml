name: Android native compile check
on:
  pull_request:
    branches: [beta, main]
    paths:
      - 'native/android/**'
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - 'vite.config.*'
      - 'capacitor.config.*'
      - 'scripts/android-update-setup.cjs'
      - '.github/workflows/android-native-check.yml'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - name: Generate native project without release signing or publishing
        run: |
          npm run mobile:build
          npx cap add android
          npx cap sync android
          node scripts/android-permissions.cjs
          node scripts/android-update-setup.cjs
          grep -q 'com.google.mlkit.vision.DEPENDENCIES' android/app/src/main/AndroidManifest.xml
          grep -q 'barcode_ui' android/app/src/main/AndroidManifest.xml
      - name: Compile native app and plugins
        working-directory: android
        run: bash gradlew :app:compileDebugJavaWithJavac --no-daemon

  windows-renderer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build Windows renderer without publishing
        run: npm run build
        env:
          DESKTOP_BUILD: '1'
      - run: npm run test:database-upgrade
      - run: npm run test:sync-pipeline
      - run: npm run verify:sqlserver-schema
