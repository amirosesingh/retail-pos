name: Publish beta - Android, Windows and iPhone
on:
  # A release tag is created only after the owner says "Publish beta now".
  # This works before this workflow has been promoted to the default branch.
  push:
    tags: ['beta-publish-*']
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter Publish beta now after the owner requests this release'
        required: true
        type: string
      cleanup_previous_betas:
        description: 'Keep this new beta and only the newest previous beta'
        type: boolean
        default: false
concurrency:
  group: beta-release
  cancel-in-progress: false
permissions:
  contents: write
  checks: read
jobs:
  prepare:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/beta-publish-')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/beta' && inputs.confirmation == 'Publish beta now')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.beta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an explicit beta publication and passing checks
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/check-beta-publication.cjs
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - id: beta
        run: echo "version=$(node scripts/prepare-beta.cjs --next)" >> "$GITHUB_OUTPUT"
  windows:
    needs: prepare
    uses: ./.github/workflows/desktop-release.yml
    with:
      build_only: true
      release_channel: beta
      beta_version: ${{ needs.prepare.outputs.version }}
      beta_number: ${{ fromJSON(github.run_number) }}
    secrets: inherit
  android:
    needs: prepare
    uses: ./.github/workflows/android-apk.yml
    with:
      build_only: true
      release_channel: beta
      beta_version: ${{ needs.prepare.outputs.version }}
      beta_number: ${{ fromJSON(github.run_number) }}
    secrets: inherit
  ios:
    needs: prepare
    uses: ./.github/workflows/ios-beta-build.yml
    with:
      beta_version: ${{ needs.prepare.outputs.version }}
  publish:
    needs: [prepare, windows, android, ios]
    runs-on: ubuntu-latest
    concurrency:
      group: pos-beta-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: Retail-windows-publish
          path: upload
      - uses: actions/download-artifact@v8
        with:
          name: Retail-android-publish
          path: release-assets
      - name: Publish beta downloads only
        env:
          BETA_VERSION: ${{ needs.prepare.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/publish-beta-release.cjs
      - uses: actions/download-artifact@v8
        with:
          name: Retail-iOS-Beta-unsigned-${{ github.sha }}
          path: ios-release-assets
      - name: Publish matching unsigned iPhone download
        env:
          BETA_VERSION: ${{ needs.prepare.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/publish-ios-beta.cjs
      - name: Attach beta installers as a prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Retail Beta ${{ needs.prepare.outputs.version }}
          prerelease: true
          make_latest: false
          files: |
            upload/*.exe
            upload/*.blockmap
            upload/latest.yml
            release-assets/*.apk
            ios-release-assets/*.ipa
      - name: Keep the latest six beta versions only
        env:
          BETA_RETENTION_LIMIT: ${{ inputs.cleanup_previous_betas && '2' || '6' }}
          GH_TOKEN: ${{ github.token }}
          BETA_VERSION: ${{ needs.prepare.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/prune-beta-releases.cjs
