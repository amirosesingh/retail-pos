name: Security checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guardrails:
    name: Role & permission regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Permission & route-guard tests
        run: npx vitest run
      - name: Sync, startup and database-upgrade regression tests
        run: node --test scripts/test-sync-pipeline.cjs scripts/test-startup-cloud.cjs scripts/test-event-sync.cjs scripts/test-company-identity.cjs scripts/test-database-upgrade.cjs
      - name: SQL schema and synchronization contract checks
        run: |
          npm run verify:sqlserver-schema
          npm run verify:sync-registry
          node scripts/audit-supabase-install-order.cjs
      - name: Lint
        run: npm run lint
      - name: Typecheck & build
        run: |
          npx tsc --noEmit
          npm run build
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Report findings to the app
        if: always() && github.ref == 'refs/heads/main'
        env:
          INGEST_URL: ${{ secrets.SECURITY_ALERT_INGEST_URL }}
          INGEST_SECRET: ${{ secrets.SECURITY_ALERT_INGEST_SECRET }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$INGEST_URL" ] || [ -z "$INGEST_SECRET" ]; then
            echo "Alert ingest not configured; skipping."; exit 0
          fi
          if [ "$OUTCOME" = "success" ]; then
            BODY=$(jq -nc --arg ref "$RUN_URL" '{deploymentRef:$ref, findings:[]}')
          else
            BODY=$(jq -nc --arg ref "$RUN_URL" '{deploymentRef:$ref, findings:[{id:"ci_guardrails_failed", severity:"high", title:"Deployment security checks failed", detail:("The security workflow failed on main. Review the run: " + $ref)}]}')
          fi
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$INGEST_SECRET" | awk '{print $2}')
          curl -sS -X POST "$INGEST_URL" -H 'Content-Type: application/json' \
            -H "x-security-signature: sha256=$SIG" --data "$BODY"
