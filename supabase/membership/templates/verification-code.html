<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your membership verification code</title></head>
  <body style="margin:0;padding:24px;background:#f6f7f8;color:#17212b;font-family:Arial,sans-serif">
    <main style="max-width:480px;margin:0 auto;background:#fff;border:1px solid #e4e7eb;border-radius:16px;padding:28px">
      <h1 style="font-size:22px;margin:0 0 16px">Verify your email</h1>
      <p style="font-size:15px;line-height:1.6">Enter this code on the membership page you already have open:</p>
      <p style="font-size:32px;font-weight:bold;letter-spacing:8px;text-align:center;padding:20px 8px;background:#f6f7f8;border-radius:12px">{{ .Token }}</p>
      <p style="font-size:14px;line-height:1.6">Use the most recent code. Keep it private and do not share it with anyone. If the code has expired, request another one from the membership page.</p>
      <p style="font-size:13px;line-height:1.6;color:#64748b">If you did not request this email, you can ignore it.</p>
    </main>
  </body>
</html>
